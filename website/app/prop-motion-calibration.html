<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StarNet motion region calibration</title><style>
*{box-sizing:border-box}body{margin:0;background:#14211e;color:#e8e3d2;font:15px/1.5 system-ui}main{max-width:1180px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{color:#b8c4b8}select,button{font:inherit;color:inherit;background:#263831;border:1px solid #52675e;padding:9px;border-radius:5px;margin-right:8px}.layout{display:grid;grid-template-columns:2fr 1fr;gap:22px;margin-top:20px}.stage{min-height:400px;border:1px solid #42574d;background:#25352e;display:flex;align-items:center;justify-content:center}.stage svg{width:100%;height:520px;object-fit:contain}.notes{padding:18px;background:#1c2c25}.legend{font-size:13px}.legend span{display:block;margin:5px 0}.mode{color:#dcc28b}pre{white-space:pre-wrap;font:12px/1.5 monospace;overflow-wrap:anywhere}.hide-regions .region{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.stage svg{height:420px}}
</style><main><h1>Motion region calibration</h1><p>Measured regions on the new painted artwork. These guides describe placement and behavior; they do not demonstrate live animation.</p><select id="prop" aria-label="Calibrated prop"></select><button id="overlay">Hide regions</button><span id="count"></span><div class="layout"><div class="stage" id="stage"></div><aside class="notes"><h2 id="name"></h2><p id="mode" class="mode"></p><div class="legend" id="legend"></div><pre id="notes"></pre></aside></div></main><script>
let recipes;const ns='http://www.w3.org/2000/svg',colors=['#f1bf57','#65e3d7','#e59ec4','#c1de83','#a3b5ff','#f49865'];
function draw(){const id=document.querySelector('#prop').value,entry=recipes.props[id],v=Object.values(entry.views)[0],svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+v.width+' '+v.height);const im=document.createElementNS(ns,'image');im.setAttribute('href','../'+v.image);im.setAttribute('width',v.width);im.setAttribute('height',v.height);svg.append(im);const legend=document.querySelector('#legend');legend.replaceChildren();let n=0;for(const [name,points]of Object.entries(v.regions||{})){if(!Array.isArray(points)||!points.length)continue;const color=colors[n++%colors.length];const shape=document.createElementNS(ns,points.length===1?'circle':'polygon');if(points.length===1){shape.setAttribute('cx',points[0][0]*v.width);shape.setAttribute('cy',points[0][1]*v.height);shape.setAttribute('r',Math.max(v.width,v.height)*.007);}else shape.setAttribute('points',points.map(p=>p[0]*v.width+','+p[1]*v.height).join(' '));shape.setAttribute('fill',color+'22');shape.setAttribute('stroke',color);shape.setAttribute('stroke-width',Math.max(v.width,v.height)*.002);shape.classList.add('region');svg.append(shape);const item=document.createElement('span');item.style.color=color;item.textContent=name;legend.append(item);}document.querySelector('#stage').replaceChildren(svg);document.querySelector('#name').textContent=id;document.querySelector('#mode').textContent=v.mode;document.querySelector('#notes').textContent=JSON.stringify({trigger:v.originalTrigger,behavior:v.behavior||v.motion?.mechanism,intentionalStatic:v.intentionalStatic,requirements:v.integrationRequirements},null,2);}
fetch('../docs/station-remaster/batch03/coordinated-motion-recipes.json').then(r=>r.json()).then(data=>{recipes=data;for(const id of Object.keys(data.props)){const opt=document.createElement('option');opt.value=id;opt.textContent=id;document.querySelector('#prop').append(opt);}document.querySelector('#count').textContent=data.recipeIds+' calibrated props';draw();}).catch(e=>document.querySelector('#count').textContent=e.message);
document.querySelector('#prop').addEventListener('change',draw);document.querySelector('#overlay').addEventListener('click',e=>{const hidden=document.body.classList.toggle('hide-regions');e.target.textContent=hidden?'Show regions':'Hide regions';});
</script></html>
