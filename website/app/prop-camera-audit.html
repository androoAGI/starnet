<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StarNet · prop camera audit</title>
<style>body{margin:0;background:#0c1115;color:#c7c7b9;font:14px monospace}header{padding:24px;position:sticky;top:0;background:#0c1115f5;border-bottom:1px solid #6b6148;z-index:1}h1{color:#d7bc84;font-size:22px;margin:0 0 12px}p{max-width:920px;line-height:1.5}a{color:#77c7d0}button{font:inherit;color:#ded5b6;background:#19242a;border:1px solid #556166;padding:8px;margin:3px;cursor:pointer}button[aria-pressed=true]{border-color:#e3bd72;color:#e3bd72}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:24px}article{padding:16px;border:1px solid #333f44;background:#141c21}figure{height:165px;margin:0;display:flex;align-items:center;justify-content:center;background:#24292b}img{max-width:240px;max-height:150px}h2{font-size:14px;color:#cfc5aa}small{color:#86b5b3}article p{font-size:12px;line-height:1.5}output{display:block;margin:12px 0;color:#a7b5b6}</style>
<header><h1>STARNET · CAMERA AUDIT</h1><p>Source inspection across the catalog. “Source check” means no obvious conflict found on the contact sheet; it does not mean approved in-game. Corrected candidates can be checked in the <a href="/?propSet=projection&amp;skinSet=study&amp;showcase=kepler">Kepler station</a>.</p><nav aria-label="Audit status"></nav><output></output></header><main></main>
<script>
(async()=>{const data=await(await fetch('assets/industrial/camera-audit/audit.json')).json(),main=document.querySelector('main'),nav=document.querySelector('nav');
const labels={open:'Needs correction', 'corrected-candidate':'Four corrected candidates','room-check':'Needs room comparison','preserve-accepted':'Accepted anchors','source-check':'Source checks',all:'All exported views'};
function show(filter){main.replaceChildren();const rows=data.records.filter(r=>filter==='all'||filter==='open'&&['rebuild','facing-gap'].includes(r.status)||r.status===filter);document.querySelector('output').textContent=rows.length+' views · '+data.records.length+' inspected exports';for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.filter===filter));for(const r of rows){const card=document.createElement('article'),figure=document.createElement('figure'),img=document.createElement('img'),h=document.createElement('h2'),tag=document.createElement('small'),p=document.createElement('p');img.src='assets/industrial/projection-correction/'+r.image;img.alt=r.id+' '+r.view+' sprite';figure.append(img);h.textContent=r.id+' · '+r.view;tag.textContent=r.status+' · '+r.footprint.w+' × '+r.footprint.h+' tiles';p.textContent=r.reason;card.append(figure,h,tag,p);main.append(card);}}
for(const[key,label]of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.dataset.filter=key;b.onclick=()=>show(key);nav.append(b);}show('open');})().catch(e=>document.querySelector('output').textContent='Audit unavailable: '+e.message);
</script></html>
