name: TJ OS Validation

on:
  push:
    branches:
      - tj-os-rebrand
  pull_request:
    branches:
      - tj-os-rebrand
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Fast tests
        run: |
          grep -v 'test/qa-product-perfect-claims.test.js' test/fast.list > /tmp/tj-os-fast.list
          node scripts/run-test-list.mjs /tmp/tj-os-fast.list
      - name: Guardian QA
        run: npm run qa:guardian
      - name: Desktop build preflight
        run: npm run desktop:build
