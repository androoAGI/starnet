# fast-gate — the release train's gate job, run on every trunk push and PR.
#
# Before this workflow, `npm run test:fast` ran in CI ONLY inside release-train.yml, so a red
# trunk was discovered at tag time (v0.2.0/v0.2.1, v0.10.10). eval-gates.yml stays as the 44s
# credential-free eval slice; this is the full 690+ step manifest gate (~4 min on ubuntu).
#
# The Chrome resolution + warm-up steps are copied verbatim from release-train.yml's gate job —
# the CDP e2e tests need a wrapper binary with --no-sandbox and a proven <10s cold start.
# Keep the two in sync; the train job remains the authority at tag time.
name: fast-gate

on:
  pull_request:
  push:
    branches: [feat/harness-backend]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # fetch-depth: 0 — the claims-authority test resolves the release-surface manifest's
      # sourceCommit against the object store; a shallow checkout reads BLOCKED on a green trunk.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Resolve Chrome binary for e2e gate tests
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "::error::no Chrome/Chromium binary on this runner — the e2e gate tests cannot run. Install one or set SKYNET_CHROME."
            exit 1
          fi
          WRAP=/usr/local/bin/starnet-ci-chrome
          printf '#!/bin/sh\nexec %s --no-sandbox --disable-dev-shm-usage "$@"\n' "$CHROME" | sudo tee "$WRAP" > /dev/null
          sudo chmod +x "$WRAP"
          echo "SKYNET_CHROME=$WRAP" >> "$GITHUB_ENV"
          echo "::notice::e2e gate tests will use $WRAP -> $CHROME (+ --no-sandbox --disable-dev-shm-usage)"

      - name: Warm Chrome, then prove CDP comes up inside the tests' 10s window
        run: |
          set -euo pipefail
          "$SKYNET_CHROME" --headless=new --no-first-run --remote-debugging-port=9332 \
            --user-data-dir="$RUNNER_TEMP/chrome-cold-warmup" about:blank > "$RUNNER_TEMP/chrome-cold-warmup.log" 2>&1 &
          CPID=$!
          ok=""
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:9332/json/list > /dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 "$CPID" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if [ -z "$ok" ]; then
            echo "::error::Chrome's bounded cold warmup did not answer within 60s. Chrome output follows."
            cat "$RUNNER_TEMP/chrome-cold-warmup.log" || true
            exit 1
          fi
          kill "$CPID" 2>/dev/null || true
          wait "$CPID" 2>/dev/null || true

          "$SKYNET_CHROME" --headless=new --no-first-run --remote-debugging-port=9333 \
            --user-data-dir="$RUNNER_TEMP/chrome-cdp-proof" about:blank > "$RUNNER_TEMP/chrome-cdp-proof.log" 2>&1 &
          CPID=$!
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9333/json/list > /dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 "$CPID" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if [ -z "$ok" ]; then
            echo "::error::Warm Chrome CDP did not answer within the tests' 10s budget. Chrome output follows."
            cat "$RUNNER_TEMP/chrome-cdp-proof.log" || true
            exit 1
          fi
          kill "$CPID" 2>/dev/null || true
          wait "$CPID" 2>/dev/null || true
          echo "::notice::Warm Chrome CDP answered within the tests' 10s budget."

      - name: Fast test gate
        run: npm run test:fast

      - name: Customer journey regression gate
        run: npm run qa:customer-journeys

  # The sidecar/HTTP integration gate (test/http.list: every suite that boots a real sidecar or owns a socket), on
  # every trunk push and PR. Before this job http.list ran only on a developer box, so a route, boot or recovery
  # regression surfaced at release time or in a user's report. The list runs as four contiguous shards in declared
  # order (scripts/run-test-list.mjs --shard=K/N); fail-fast is off so one red shard never hides another's result.
  # Every step carries the runner's own bound (120 s, 600 s for test/slow.list), so a hung suite fails by name
  # instead of eating the job's timeout, and --deadline ends the shard with its failure list 2 min inside the
  # 30 min wrapper. The Chrome steps are the gate job's, verbatim (several e2e suites drive
  # CDP): keep the three copies (here, the gate job, release-train.yml) in sync.
  http-gate:
    name: http-gate (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Resolve Chrome binary for e2e gate tests
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "::error::no Chrome/Chromium binary on this runner — the e2e gate tests cannot run. Install one or set SKYNET_CHROME."
            exit 1
          fi
          WRAP=/usr/local/bin/starnet-ci-chrome
          printf '#!/bin/sh\nexec %s --no-sandbox --disable-dev-shm-usage "$@"\n' "$CHROME" | sudo tee "$WRAP" > /dev/null
          sudo chmod +x "$WRAP"
          echo "SKYNET_CHROME=$WRAP" >> "$GITHUB_ENV"
          echo "::notice::e2e gate tests will use $WRAP -> $CHROME (+ --no-sandbox --disable-dev-shm-usage)"

      - name: Warm Chrome, then prove CDP comes up inside the tests' 10s window
        run: |
          set -euo pipefail
          "$SKYNET_CHROME" --headless=new --no-first-run --remote-debugging-port=9332 \
            --user-data-dir="$RUNNER_TEMP/chrome-cold-warmup" about:blank > "$RUNNER_TEMP/chrome-cold-warmup.log" 2>&1 &
          CPID=$!
          ok=""
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:9332/json/list > /dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 "$CPID" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if [ -z "$ok" ]; then
            echo "::error::Chrome's bounded cold warmup did not answer within 60s. Chrome output follows."
            cat "$RUNNER_TEMP/chrome-cold-warmup.log" || true
            exit 1
          fi
          kill "$CPID" 2>/dev/null || true
          wait "$CPID" 2>/dev/null || true

          "$SKYNET_CHROME" --headless=new --no-first-run --remote-debugging-port=9333 \
            --user-data-dir="$RUNNER_TEMP/chrome-cdp-proof" about:blank > "$RUNNER_TEMP/chrome-cdp-proof.log" 2>&1 &
          CPID=$!
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9333/json/list > /dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 "$CPID" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if [ -z "$ok" ]; then
            echo "::error::Warm Chrome CDP did not answer within the tests' 10s budget. Chrome output follows."
            cat "$RUNNER_TEMP/chrome-cdp-proof.log" || true
            exit 1
          fi
          kill "$CPID" 2>/dev/null || true
          wait "$CPID" 2>/dev/null || true
          echo "::notice::Warm Chrome CDP answered within the tests' 10s budget."

      - name: HTTP test gate (shard ${{ matrix.shard }}/4)
        run: node scripts/timeout.mjs --label test:http --timeout=1800000 -- node scripts/run-test-list.mjs test/http.list --shard=${{ matrix.shard }}/4 --deadline=1680000

  # Pure Rust policy checks. The connector key policy tests in src-tauri/src/credentials.rs and the acceptance
  # harness's input guards use injected closures and input checks only: no keychain entry, no native process, no
  # app build. Running them here catches a policy regression (for example regenerating over a malformed existing
  # key, which would orphan every sealed connector credential) and a credentials.rs compile error before a cut.
  # Never pass --ignored: that runs the production-entry roundtrip test. The native phases stay in the
  # dispatch-only connector-keychain-acceptance workflow.
  rust-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Connector key policy and acceptance guard tests (pure, no keychain access)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path test/native-connector-keychain/Cargo.toml connector_key_policy 2>&1 | tee "$RUNNER_TEMP/policy.log"
          cargo test --locked --manifest-path test/native-connector-keychain/Cargo.toml acceptance_guards 2>&1 | tee "$RUNNER_TEMP/guards.log"
          # a renamed test would leave a filter matching nothing, which cargo passes green: require a passed test in each
          for log in policy guards; do
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/$log.log" || { echo "::error::the $log filter ran no test"; exit 1; }
          done
