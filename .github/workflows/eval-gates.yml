# eval-gates — recurring credential-free eval slice.
#
# Runs on every PR and every push to trunk (feat/harness-backend). Evals only — the full
# test:fast gate stays where it is (release train). Nothing here needs a provider key,
# touches the public network, or claims model quality: this slice proves harness PLUMBING
# (contract/claims coherence, deterministic loop conformance, 10x100 fault-boundary
# recovery, and offline parity oracle + zero-tolerance violation detection).
#
# The fault capture runs the full frozen 100 repeats per boundary (~15s measured); the
# runner refuses any other repeat count against the frozen contract, so there is no
# reduced-repeat CI mode — and none is needed.
#
# One durable receipt is written to qa/eval-receipts/last-gate-receipt.json (committed
# home; .dogfood/ is gitignored and its receipts do not survive). The receipt is printed
# to the job log and uploaded as an artifact so a red run still leaves evidence.
name: eval-gates

on:
  pull_request:
  push:
    branches: [feat/harness-backend]

jobs:
  credential-free-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Credential-free eval gate (contract, quality, fault x100, parity-offline)
        run: npm run eval:gate

      - name: Print gate receipt
        if: always()
        run: cat qa/eval-receipts/last-gate-receipt.json || echo "no receipt was written"

      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-receipt
          path: qa/eval-receipts/last-gate-receipt.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------
  # windows-checkout — the gate's own portability, proven on the platform that breaks it.
  #
  # test:fast runs on ubuntu-latest everywhere else in CI (here and in release-train.yml),
  # so nothing in this repo ever executed it on Windows. It did not pass: Git for Windows
  # installs core.autocrlf=true, the repo had no .gitattributes, and every Windows clone
  # got a CRLF worktree that the source-regex tests cannot read — the gate died at step
  # 56/683 in test/checkpoint-default-on.test.js on a clean clone. Windows is a first-class
  # shipping platform for this product, so a Windows contributor could not run the gate.
  #
  # Deliberately forces the hostile setting rather than trusting the runner's default: this
  # job must reproduce a real contributor's clone, not a lucky one. With .gitattributes in
  # place, eol=lf wins over autocrlf and the checkout lands LF anyway — which is the claim
  # under test. Scoped to the eol guard plus the source-regex steps that CRLF actually
  # breaks, so the leg stays cheap enough to run on every PR.
  # ---------------------------------------------------------------------------------------
  windows-checkout:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Clone the way Git for Windows ships (core.autocrlf=true)
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout is LF despite autocrlf=true
        run: node test/checkout-eol-integrity.test.js

      - name: The source-regex steps CRLF used to break
        run: npm run test:fast -- checkpoint-default-on source-text-integrity module-scope-shadowing

      # The other Windows-only breakage: report() used to process.exit() while a spawned child's
      # handles were live, which aborts libuv on Windows ("Assertion failed: !(handle->flags &
      # UV_HANDLE_CLOSING)") and killed the step with 0xC0000409 on the line AFTER it printed OK.
      # test:http died at step 6/83 and runs in NO workflow at all, so nothing saw it.
      #
      # These three spawn a sidecar AND reported before their cleanup, so they were the reliable
      # reproducers -- update-preparation aborted on 7 runs in 8. The fix is in test/_assert.js and
      # is global, so this is a smoke test for the whole class, not just these files. Kept to a
      # 3-step subset (~7s local) rather than the full 83-step list, because the full suite now
      # runs in the http-gate job below -- but on ubuntu, and this abort only ever happened on
      # Windows. That is exactly why this cheap Windows leg stays: http-gate cannot see it.
      - name: Child-spawning http steps run without a libuv abort
        run: npm run test:http -- update-preparation workspace-owner workspace-lineage

  # ---------------------------------------------------------------------------------------
  # http-gate — test:http had no home in CI at all, on any platform.
  #
  # 83 steps covering routes, streaming, persistence, providers, tools, schedules and channels
  # — the paths CONTRIBUTING.md tells contributors to exercise — and not one workflow ran them.
  # That is how the libuv abort in test/_assert.js survived: the suite died at step 6/83 on
  # Windows and no pipeline was watching. It is fixed and the suite is green (83/83, 509s on
  # win32/arm64), but a fix nothing guards is a fix waiting to be undone.
  #
  # Deliberately its OWN job in eval-gates rather than a step in release-train's gate. The
  # honest reason: this was verified on Windows and NOT on ubuntu — no Linux was available to
  # check it on. Here a surprise costs a red PR check that someone reads; in the release train
  # it would stop a release. Promote it there once it has proven itself green over some runs.
  #
  # 25 minutes because the suite's own runner budget is 600s and CI runners are slower than a
  # dev box; the job should fail on a real regression, not on being under-timed.
  # ---------------------------------------------------------------------------------------
  http-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: HTTP/e2e gate (83 steps — routes, streaming, persistence, providers, channels)
        run: npm run test:http
