name: Bug report
description: Report reproducible incorrect behavior in StarNet
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve StarNet. Do not include secrets or private data.

        **First, press COPY DIAGNOSTICS.** In StarNet, press **SETTINGS** on the dock, open **APP & BACKUP**, find **DIAGNOSTICS** and press **⧉ COPY DIAGNOSTICS**. Then paste the readout into the Diagnostics box below. It carries your app version, platform, provider and model, and the tail of recent errors. It never carries your keys, tokens, messages or prompts.
        - If StarNet stopped on its error screen, press the **⧉ COPY DIAGNOSTICS** button on that screen.
        - If a chat reply failed, press **⧉ copy diagnostics for a bug report** under it.
  - type: input
    id: version
    attributes:
      label: StarNet version
      description: >-
        Press UPDATES on the dock: the top of the UPDATE CENTER reads "current v…". The same line is in
        SETTINGS › APP & BACKUP › UPDATES, and the COPY DIAGNOSTICS readout carries it too. For a source
        checkout, give the commit.
      placeholder: v0.15.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS Apple Silicon, macOS Intel, Linux, Source checkout]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Tell us exactly what you did and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (COPY DIAGNOSTICS)
      description: >-
        Paste the readout from SETTINGS › APP & BACKUP › DIAGNOSTICS › ⧉ COPY DIAGNOSTICS, or from the button on
        the error screen. Read it before you post, and remove any private names or paths. If StarNet will not open
        at all, say so here.
      render: text
