[package]
name = "starnet-process-ownership-rules"
version = "0.1.0"
edition = "2021"
publish = false

# The desktop shell's process-ownership modules (src-tauri/src/process_identity.rs, process_job.rs, sidecar_startup.rs,
# sidecar_reap.rs, fresh_start.rs), compiled BY PATH without the app or Tauri, so their unit tests run in the fast gate
# (.github/workflows/fast-gate.yml rust-policy) on every PR — above all the parity tests that read the SAME fixture file
# as the sidecar's JS rule (test/fixtures/process-identity-cases.json). Same pins as src-tauri/Cargo.lock.
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[workspace]
