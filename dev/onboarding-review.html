<!doctype html><html><head><meta charset="utf-8"><title>Onboarding conversation preview</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/onboarding.css"><style>body{margin:0;background:#080b0b;color:#f1764c;font-family:VT323,monospace}#chat-panel{position:relative;width:min(760px,100vw);height:90vh;margin:24px auto;display:block}.fnv-dialogue{position:absolute;inset:0}#review-receipt{white-space:pre-wrap;position:fixed;bottom:0;left:12px;font-size:12px}</style></head><body><div id="chat-panel"></div><div style="position:fixed;bottom:32px;left:12px;font-size:14px">UI preview · demo model replies · scratch data only</div><output id="review-receipt"></output><script>const World={};const Chat={beginInterview(){},endInterview(){},typeLine(s,cb){cb()}};const Harness={configured(){return true},chat(request){const d=request.messages[0].content;return Promise.resolve({text:d.includes('THE READ')?'READ: you want a useful starting point for your agent.\nPURPOSE: Help explore and build useful projects together.\nSTACK: NONE':d.includes('THE TUESDAY')?'ACK: we can find a useful place to start.\nASK: what is something you would enjoy making or learning?':''})}};const DossierStore={upsert(dim,belief){document.getElementById('review-receipt').textContent='Demo memory receipt — '+dim+': '+belief.text;localStorage.setItem('review-belief',JSON.stringify({dim,belief}))}};</script><script src="/app/dialogue.js"></script><script src="/app/wakemind.js"></script><script src="/app/onboarding.js"></script><script>Onboarding.start({wake:false,name:'NOVA',docs:{},commit(patch){localStorage.setItem("review-context",JSON.stringify(patch));},done(){}});</script></body></html>
